name: Azure Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Azure App Service Free Tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Replace with your actual Azure App Service URL if different
          curl -f https://questxp.azurewebsites.net/api/health || echo "Ping failed, but workflow continues"
