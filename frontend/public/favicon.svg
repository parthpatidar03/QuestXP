<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF685C"/>
      <stop offset="1" stop-color="#B71A12"/>
    </linearGradient>
    <!-- inner rim: a blurred offset copy of the shape, clipped to it -->
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
      <feOffset in="b" dx="-1.4" dy="-1.4" result="ol"/>
      <feComposite in="ol" in2="SourceAlpha" operator="out" result="light"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.5"/>
      <feComposite in2="light" operator="in" result="lightRim"/>
      <feOffset in="b" dx="1.4" dy="1.4" result="od"/>
      <feComposite in="od" in2="SourceAlpha" operator="out" result="dark"/>
      <feFlood flood-color="#5A0C08" flood-opacity="0.45"/>
      <feComposite in2="dark" operator="in" result="darkRim"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="lightRim"/>
        <feMergeNode in="darkRim"/>
      </feMerge>
    </filter>
    <clipPath id="body">
      <rect x="3" y="3" width="58" height="58" rx="17"/>
    </clipPath>
  </defs>

  <g clip-path="url(#body)">
    <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#clay)" filter="url(#rim)"/>
  </g>

  <!-- play mark -->
  <path d="M23.3 21.6a2.6 2.6 0 0 1 3.95-2.23l14.4 8.9a2.6 2.6 0 0 1 0 4.43l-14.4 8.9a2.6 2.6 0 0 1-3.95-2.22z"
        fill="#fff"/>
  <!-- XP spark -->
  <path d="M44.8 14.1c.6 3.35 1.6 4.35 4.95 4.95-3.35.6-4.35 1.6-4.95 4.95-.6-3.35-1.6-4.35-4.95-4.95 3.35-.6 4.35-1.6 4.95-4.95z"
        fill="#fff"/>
</svg>
